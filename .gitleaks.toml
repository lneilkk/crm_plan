# gitleaks 설정 — 비밀정보(키·토큰·비밀번호)가 커밋에 들어가면 CI를 실패시킨다. (CLAUDE.md 절대 규칙 2)
#
# - CI(.github/workflows/ci.yml)와 로컬(scripts/ci/secret-scan.sh)이 이 파일 하나를 같이 쓴다.
# - gitleaks 버전은 scripts/ci/secret-scan.sh에 고정되어 있다. 버전을 올릴 때는 이 파일의 문법도 같이 확인한다.

title = "치과 CRM gitleaks 설정"

# 기본 규칙(v8.30.1 기준 222개)을 그대로 쓰고, 아래에 적은 것만 덧붙인다.
[extend]
useDefault = true

# ── 추가 규칙 ────────────────────────────────────────────────────────────────
# 기본 규칙은 POSTGRES_PASSWORD=... 같은 '이름=값' 형태는 잡지만, 접속 주소 안에 들어 있는 비밀번호
# (postgresql://계정:비밀번호@호스트)는 잡지 못한다(v8.30.1로 확인). 절대 규칙 2가 DB 접속 정보를
# 저장소에 쓰지 못하게 하므로 이 한 가지만 규칙으로 추가한다.
[[rules]]
id = "crm-postgres-url-password"
description = "비밀번호가 들어 있는 PostgreSQL 접속 주소. 접속 주소는 .env(git 제외)와 Secrets Manager에만 둔다."
regex = '''(?i:postgres(?:ql)?)://[^\s:/@'"\x60]+:([^\s/@'"\x60]+)@'''
secretGroup = 1
keywords = ["postgres://", "postgresql://"]

# 허용: 비밀번호 자리에 실제 값이 아니라 자리표시자가 적힌 주소. 아래 두 가지 모양만 통과시킨다.
# 소문자 `password`, `crm` 같은 값은 실제로 쓰일 수 있는 (약한) 비밀번호이므로 허용하지 않는다.
[[rules.allowlists]]
regexes = [
    # 코드에서 변수로 조립하는 주소 — 예) scripts/dev/setup-env.mjs의 `postgresql://${user}:${dbPassword}@...`
    '''^\$\{[^}]+\}$''',
    # 문서·주석의 형식 설명 — 예) .env.example의 `postgresql://USER:PASSWORD@127.0.0.1:PORT/DB`, `<비밀번호>`, `****`
    # PASSWORD는 대문자로 쓴 것만 자리표시자로 본다.
    '''^(?:PASSWORD|<[^>]+>|\*+)$''',
]

# ── 전역 허용 목록 ───────────────────────────────────────────────────────────
# 지금은 비어 있다. 이미 커밋된 오탐 5건(자리표시 주소·테스트용 가짜 비밀번호)은 .gitleaksignore에서 한 건씩 넘긴다.
# package-lock.json의 integrity 해시와 node_modules는 기본 규칙의 전역 허용 목록이 이미 제외한다.
#
# 오탐이 생기면 규칙을 끄지 말고, 그 한 건만 좁게 허용하고 항목마다 이유를 주석으로 적는다.
#
# [[allowlists]]
# description = "왜 비밀정보가 아닌지 한 줄로 적는다"
# targetRules = ["generic-api-key"]            # 오탐을 낸 규칙만
# paths = ['''^tests/fixtures/sample\.ts$''']  # 그 파일만
#
# 이미 커밋된 한 건만 넘길 때는 저장소 루트의 .gitleaksignore에 스캔 결과의 Fingerprint를 한 줄 적는다.
# 진짜 비밀정보가 커밋되었다면 허용 목록에 넣지 말고 그 키를 즉시 폐기·재발급한다.
