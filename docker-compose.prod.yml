# 운영(프로토타입 서버) 구성 — T10-1. 설명은 docs/DEPLOY.md.
#
#   docker-compose -f docker-compose.prod.yml up -d --build
#
# - R1~R2: 외부 서버에서 이 파일로 띄운다. R3(AWS)도 같은 파일을 쓴다.
# - HTTPS는 앞단 리버스 프록시(Caddy 등, T10-4)가 맡는다. 앱 포트는 127.0.0.1에만 연다.
# - 비밀값은 이 파일에 적지 않는다(절대 규칙 2). 값은 모두 .env에서 온다(env_file + ${} 치환).
# - docker-compose v1.29와 docker compose v2에서 모두 동작해야 한다. v1이 거부하는 키
#   (name, start_interval, env_file의 required 등)는 쓰지 않는다.
# - 로컬 개발용 docker-compose.yml과 섞어 쓰지 않는다. DB 데이터는 이름 있는 볼륨(pgdata)에 둔다.

x-db-url: &db-url
  # 컨테이너끼리는 서비스 이름 db로 접속한다. .env의 DATABASE_URL(개발용 127.0.0.1 주소)은 여기서 덮어쓴다.
  # POSTGRES_PASSWORD는 접속 주소에 그대로 넣을 수 있는 문자(base64url)만 써야 한다.
  DATABASE_URL: "postgresql://${POSTGRES_USER:?.env에 값이 없습니다}:${POSTGRES_PASSWORD:?.env에 값이 없습니다}@db:5432/${POSTGRES_DB:?.env에 값이 없습니다}"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?.env에 값이 없습니다}"
      POSTGRES_DB: "${POSTGRES_DB:?.env에 값이 없습니다}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?.env에 값이 없습니다}"
    # 포트를 밖으로 열지 않는다. app·migrate만 내부 네트워크로 접속한다.
    volumes:
      - pgdata:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 한 번 실행하고 끝나는 마이그레이션(prisma migrate deploy). up 할 때마다 app보다 먼저 돈다.
  # 시드: docker-compose -f docker-compose.prod.yml run --rm migrate prisma db seed
  migrate:
    build:
      context: .
      target: migrate
    image: crm_plan_migrate:latest
    env_file: .env
    environment:
      <<: *db-url
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: .
      target: runtime
    image: crm_plan_app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *db-url
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # 시드 전용 값은 앱에 넘기지 않는다(최소 권한). env_file로 들어온 값을 빈 값으로 덮어쓴다.
      SEED_STAFF_PASSWORD: ""
      FAKE_DATA_ALLOWED: ""
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      # 리버스 프록시가 같은 서버에서 127.0.0.1:APP_PORT로 넘겨 준다. 바깥에 직접 열지 않는다.
      - "127.0.0.1:${APP_PORT:-3100}:3000"
    # 이미지의 HEALTHCHECK(node healthcheck.mjs → /api/health)를 그대로 쓴다.
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
